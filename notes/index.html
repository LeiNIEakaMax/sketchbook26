<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes · sketchbook26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Schibsted+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* The notes folder: every sticky note on the site, grouped by the page it's stuck on.
       Click a note to go to it. The notes themselves are drawn by assets/sticky.js. */
    body { margin: 0; min-height: 100vh; background: #1b1b1b radial-gradient(circle, #343434 1px, transparent 1.4px) 0 0 / 24px 24px; color: #eee;
      font: 15px/1.5 'Schibsted Grotesk', system-ui, sans-serif; }
    .back { position: fixed; top: 8px; left: 12px; font: 12px/1.4 ui-monospace, monospace; color: #888; text-decoration: none; z-index: 2; }
    .back:hover { color: #eee; }
    header, main { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    header { padding-top: 48px; }
    h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
    header p { margin: 6px 0 0; color: #8a8a8a; font: 12px/1.6 'JetBrains Mono', ui-monospace, monospace; }
    main { padding-bottom: 64px; }
    .sb-page { margin-top: 40px; }
    .sb-page h2 { margin: 0 0 20px; padding-bottom: 8px; border-bottom: 1px solid #2a2a2a; font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
    .sb-page h2 a { color: inherit; text-decoration: none; }
    .sb-page h2 a:hover { color: #28e5b0; }
    .sb-page h2 small { font: 12px/1 'JetBrains Mono', ui-monospace, monospace; color: #8a8a8a; }
    .sb-grid { display: flex; flex-wrap: wrap; gap: 28px 24px; }
    .sb-empty { margin-top: 40px; color: #8a8a8a; font: 13px/1.6 'JetBrains Mono', ui-monospace, monospace; max-width: 40em; }
  </style>
  <script src="../assets/sticky.js" data-folder="true" defer></script>
</head>
<body>
  <a class="back" href="../">← sketchbook26</a>
  <header>
    <h1>Notes</h1>
    <p id="sb-folder-count">&nbsp;</p>
  </header>
  <main id="sb-folder"></main>
</body>
</html>
