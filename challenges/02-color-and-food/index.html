<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color and food · CC2026</title>
  <style>
    :root { --bg: #06155d; --ink: #ffffff; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas.stage { display: block; touch-action: none; }
    .back { position: fixed; top: 8px; left: 12px; font: 12px/1.4 ui-monospace, monospace; color: var(--ink); opacity: .6; text-decoration: none; }
    .back:hover { opacity: 1; }

    .note { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 90vw;
      font: 11px/1.4 ui-monospace, monospace; color: var(--ink); opacity: .75; text-align: center; }
    .note:empty { display: none; }

    @font-face { font-family: "LT Remark"; src: url("fonts/LTRemark-Regular.otf") format("opentype");
      font-weight: 400; font-style: normal; font-display: block; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <script src="stage.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <a class="back" href="../../">← CC2026</a>
  <p class="note" id="note" role="status"></p>
</body>
</html>
